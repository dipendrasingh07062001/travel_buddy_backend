version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Type definitions follow the Node.js 24 runtime in the Docker image.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Prisma 8 is a separate migration.
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      # Prisma's adapter still sends overlapping queries inside transactions,
      # which pg 9 no longer queues.
      - dependency-name: pg
        update-types: ['version-update:semver-major']
