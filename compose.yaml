services:
  postgres:
    image: postgres:17-alpine
    container_name: travel-buddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_buddy
      POSTGRES_USER: travel_buddy
      POSTGRES_PASSWORD: travel_buddy
    ports:
      - '5432:5432'
    volumes:
      - travel-buddy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel_buddy -d travel_buddy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel-buddy-postgres-data:
